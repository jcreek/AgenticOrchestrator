[package]
name = "orchestrator-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ignore = "0.4.34"
notify = "8.2.2"
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows ={ version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cucumber = "=0.23.0"
futures = "=0.3.34"

[[test]]
name = "bdd"
path = "tests/bdd/main.rs"
harness = false

[features]
specta = ["dep:specta"]

[lints]
workspace = true
