[package]
name = "app"
version = "0.4.0"
description = "Agentic Orchestrator"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which clashes on Windows.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.2", features = ["v4"] }
which = "=8.0.6"
orchestrator-core = { version = "0.1.0", path = "../../crates/core", features = ["specta"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
