[workspace]
resolver = "3"
members = ["crates/core", "crates/claude-stub", "app/src-tauri"]
exclude = ["spikes"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
